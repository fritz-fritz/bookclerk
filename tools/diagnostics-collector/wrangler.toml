# Cloudflare Worker — deployed by GitHub Actions (wrangler-action).
# See .github/workflows/diagnostics-collector-deploy.yml
name = "libation-diagnostics"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Published URL: https://{name}.{WORKERS_DEV_SUBDOMAIN}.workers.dev
[vars]
WORKERS_DEV_SUBDOMAIN = "fritztech"
WORKER_NAME = "libation-diagnostics"

[secrets]
required = [
  "B2_KEY_ID",
  "B2_APPLICATION_KEY",
  "B2_BUCKET_ID",
  "REPORT_API_KEY",
]

# Runtime secrets are set on deploy from GitHub Actions secrets (see deploy workflow).
# Optional: CLIENT_IP_HASH_SALT (set manually in dashboard or add to deploy workflow).
