name: Libro.fm APK API probe

# Re-extract the unofficial Libro.fm mobile API from the latest Android APK,
# live-smoke current vs extracted calls (when TEST_LIBRO_* secrets exist), and
# open a PR that updates crates/libation-libro/src/client.rs on drift.

on:
  schedule:
    # Mondays 14:00 UTC — after typical weekend Play Store pushes.
    - cron: "0 14 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/librofm-apk-probe/**"
      - ".github/workflows/librofm-apk-probe.yml"
      - "crates/libation-libro/src/client.rs"
  pull_request:
    paths:
      - "scripts/librofm-apk-probe/**"
      - ".github/workflows/librofm-apk-probe.yml"
      - "crates/libation-libro/src/client.rs"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  probe:
    name: extract / smoke / PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java (jadx)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Probe latest Libro.fm APK
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/librofm-apk-probe
          set +e
          python3 scripts/librofm-apk-probe/extract_libro_api.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --workdir "$RUNNER_TEMP/librofm-apk-probe" \
            --out-dir "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe" \
            --no-fail-on-drift
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/librofm-apk-probe/report.json ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open("artifacts/librofm-apk-probe/report.json"))["has_blocking_drift"] else 1)'; then
              echo "drift=true" >> "$GITHUB_OUTPUT"
            else
              echo "drift=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Upload probe artifacts
        if: always() && steps.probe.outputs.report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: librofm-apk-probe
          path: artifacts/librofm-apk-probe/
          if-no-files-found: warn

      - name: Summarize probe
        if: always() && steps.probe.outputs.report == 'true'
        run: |
          echo "## Libro.fm APK API probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/librofm-apk-probe/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Live-smoke current + APK-extracted API
        id: smoke
        if: always() && steps.probe.outputs.report == 'true'
        continue-on-error: true
        env:
          TEST_LIBRO_EMAIL: ${{ secrets.TEST_LIBRO_EMAIL }}
          TEST_LIBRO_USERNAME: ${{ secrets.TEST_LIBRO_USERNAME }}
          TEST_LIBRO_USER: ${{ secrets.TEST_LIBRO_USER }}
          TEST_LIBRO_PASSWORD: ${{ secrets.TEST_LIBRO_PASSWORD }}
          TEST_LIBRO_ISBN: ${{ secrets.TEST_LIBRO_ISBN }}
          LIBATION_LIBRO_PASSWORD: ${{ secrets.LIBATION_LIBRO_PASSWORD }}
        run: |
          set +e
          python3 scripts/librofm-apk-probe/live_smoke.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/report.json" \
            --profiles current,apk \
            --out "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/live_smoke.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/librofm-apk-probe/live_smoke.json ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
            echo "## Live smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/librofm-apk-probe/live_smoke.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi
          # 2 = missing credentials — treat as skipped, not failed.
          if [[ "$code" -eq 2 ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Live smoke skipped (TEST_LIBRO_* secrets not configured)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Apply suggested client.rs updates
        id: apply
        if: >
          always()
          && steps.probe.outputs.drift == 'true'
          && steps.probe.outputs.report == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && (steps.smoke.outputs.skipped == 'true' || steps.smoke.outputs.exit_code == '0')
        run: |
          python3 scripts/librofm-apk-probe/apply_client_updates.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/artifacts/librofm-apk-probe/report.json"
          if git diff --quiet -- crates/libation-libro/src/client.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with API constant updates
        if: >
          always()
          && steps.apply.outputs.changed == 'true'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(libro): sync mobile API constants from Android APK probe

            Auto-generated by librofm-apk-probe.yml after live smoke
            (or skipped smoke when TEST_LIBRO_* secrets are unset).
          branch: chore/librofm-apk-api-sync
          delete-branch: true
          title: "chore(libro): sync API constants from Libro.fm Android APK"
          body: |
            ## Summary

            The scheduled Libro.fm APK probe detected drift between the Play Store
            Android app and `crates/libation-libro/src/client.rs`.

            This PR applies the extracted constants (base URL, `/api/vN/` paths,
            `X-LibroFm-AppVer`, OkHttp user-agent).

            ### Verification

            - Probe report: see workflow artifacts `librofm-apk-probe`
            - Live smoke: runs when `TEST_LIBRO_PASSWORD` plus one of
              `TEST_LIBRO_EMAIL` / `TEST_LIBRO_USERNAME` / `TEST_LIBRO_USER`
              repository secrets are configured

            ### Notes

            - Wiremock tests bind to the path constants, so they follow this bump.
            - Review download-manifest query params / extra `X-LibroFm-*` headers
              separately if behavior still differs from the app.
          labels: librofm-api-drift

      - name: Open issue when live smoke fails
        if: >
          always()
          && steps.probe.outputs.drift == 'true'
          && steps.smoke.outputs.skipped == 'false'
          && steps.smoke.outputs.exit_code == '1'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- librofm-apk-probe-smoke-fail -->';
            const probe = fs.existsSync('artifacts/librofm-apk-probe/report.md')
              ? fs.readFileSync('artifacts/librofm-apk-probe/report.md', 'utf8')
              : '(missing report)';
            const smoke = fs.existsSync('artifacts/librofm-apk-probe/live_smoke.json')
              ? fs.readFileSync('artifacts/librofm-apk-probe/live_smoke.json', 'utf8')
              : '(missing smoke results)';
            const title = 'Libro.fm API drift: live smoke failed';
            const body = [
              marker,
              '',
              'APK probe found client.rs drift, but live smoke against Libro.fm failed.',
              'No auto-PR was opened. Inspect credentials / API breakage.',
              '',
              '<details><summary>Probe report</summary>',
              '',
              probe,
              '',
              '</details>',
              '',
              '<details><summary>Live smoke</summary>',
              '',
              '```json',
              smoke,
              '```',
              '',
              '</details>',
              '',
              `_Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}_`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => (i.body || '').includes(marker) || i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail on hard probe error
        if: always() && steps.probe.outputs.exit_code == '2'
        run: |
          echo "Libro.fm APK probe failed hard (download/decompile/parse)."
          exit 1

      - name: Fail on live smoke failure (schedule / manual)
        if: >
          always()
          && steps.smoke.outputs.skipped == 'false'
          && steps.smoke.outputs.exit_code == '1'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Live smoke failed for current and/or APK-extracted Libro.fm API calls."
          exit 1
