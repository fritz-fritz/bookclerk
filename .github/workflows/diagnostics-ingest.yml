# Daily pull of new diagnostics from the Cloudflare Worker `/report`
# endpoint, then analyze with GitHub Copilot CLI (prompt-injection guarded)
# and open issues when warranted.
#
# Required repository secret:
#   DIAGNOSTICS_REPORT_API_KEY — matches Worker REPORT_API_KEY
#
# Collector URL is derived by default:
#   https://{worker}.{subdomain}.workers.dev
#   → https://libation-diagnostics.fritztech.workers.dev
# Override with repository variable DIAGNOSTICS_COLLECTOR_BASE_URL if needed.
#
# Copilot auth: COPILOT_GITHUB_TOKEN (personal repo) or workflow GITHUB_TOKEN (org).
# https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions

name: diagnostics-ingest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Ignore stored cursor and pull from epoch (0)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  copilot-requests: write

concurrency:
  group: diagnostics-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Require report API key
        env:
          KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set DIAGNOSTICS_REPORT_API_KEY (same value as Worker REPORT_API_KEY)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Resolve collector base URL
        id: collector
        env:
          OVERRIDE: ${{ vars.DIAGNOSTICS_COLLECTOR_BASE_URL }}
          WORKER: ${{ vars.DIAGNOSTICS_WORKER_NAME }}
          SUBDOMAIN: ${{ vars.DIAGNOSTICS_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          WORKER="${WORKER:-libation-diagnostics}"
          SUBDOMAIN="${SUBDOMAIN:-fritztech}"
          if [ -n "${OVERRIDE:-}" ]; then
            BASE="${OVERRIDE%/}"
            echo "Using DIAGNOSTICS_COLLECTOR_BASE_URL override: $BASE"
          else
            BASE="https://${WORKER}.${SUBDOMAIN}.workers.dev"
            echo "Derived collector URL: $BASE"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Restore pull cursor
        if: ${{ inputs.force_full != true }}
        uses: actions/cache/restore@v4
        with:
          path: .diagnostics-cursor
          key: diagnostics-pull-cursor-v1
          restore-keys: |
            diagnostics-pull-cursor-v1

      - name: Resolve since
        id: cursor
        env:
          FORCE: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          SINCE=0
          if [ "${FORCE:-false}" != "true" ] && [ -f .diagnostics-cursor/since ]; then
            SINCE=$(tr -d '[:space:]' < .diagnostics-cursor/since)
            case "$SINCE" in
              ''|*[!0-9]*) SINCE=0 ;;
            esac
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "Using since=$SINCE"

      - name: Pull /report
        id: pull
        env:
          BASE: ${{ steps.collector.outputs.base }}
          KEY: ${{ secrets.DIAGNOSTICS_REPORT_API_KEY }}
          SINCE: ${{ steps.cursor.outputs.since }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/diagnostics-batch
          HTTP=$(curl -sS -o /tmp/diagnostics-batch/report.json -w "%{http_code}" \
            -H "Authorization: Bearer ${KEY}" \
            -H "Accept: application/json" \
            "${BASE}/report?since=${SINCE}")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Worker /report returned HTTP $HTTP"
            head -c 2000 /tmp/diagnostics-batch/report.json || true
            exit 1
          fi
          COUNT=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("count",0))')
          NEXT=$(python3 -c 'import json; print(json.load(open("/tmp/diagnostics-batch/report.json")).get("next_since",0))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next_since=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Pulled count=$COUNT next_since=$NEXT"

      - name: Setup Node + Copilot CLI
        if: steps.pull.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        if: steps.pull.outputs.count != '0'
        run: |
          npm install -g @github/copilot
          copilot --version || true

      - name: Resolve Copilot auth
        if: steps.pull.outputs.count != '0'
        id: copilot_auth
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          LEGACY_PAT: ${{ secrets.DIAGNOSTICS_COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAT="${COPILOT_PAT:-}"
          if [ -z "$PAT" ] && [ -n "${LEGACY_PAT:-}" ]; then
            PAT="$LEGACY_PAT"
            echo "Using legacy DIAGNOSTICS_COPILOT_GITHUB_TOKEN secret (prefer COPILOT_GITHUB_TOKEN)"
          fi
          if [ -n "$PAT" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "Copilot auth: COPILOT_GITHUB_TOKEN (PAT — personal repo / explicit override)"
          else
            echo "mode=actions" >> "$GITHUB_OUTPUT"
            echo "Copilot auth: workflow GITHUB_TOKEN (org billing via copilot-requests: write)"
          fi

      - name: Analyze with Copilot (guarded)
        if: steps.pull.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.DIAGNOSTICS_COPILOT_GITHUB_TOKEN || github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.DIAGNOSTICS_COPILOT_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          chmod +x tools/diagnostics-collector/scripts/analyze-with-copilot.sh
          tools/diagnostics-collector/scripts/analyze-with-copilot.sh \
            /tmp/diagnostics-batch/report.json

      - name: Persist pull cursor
        if: success() && steps.pull.outputs.next_since != '' && steps.pull.outputs.next_since != '0'
        env:
          NEXT: ${{ steps.pull.outputs.next_since }}
        run: |
          mkdir -p .diagnostics-cursor
          printf '%s\n' "$NEXT" > .diagnostics-cursor/since

      - name: Save pull cursor
        if: success() && steps.pull.outputs.next_since != '' && steps.pull.outputs.next_since != '0'
        uses: actions/cache/save@v4
        with:
          path: .diagnostics-cursor
          key: diagnostics-pull-cursor-v1-${{ github.run_id }}-${{ steps.pull.outputs.next_since }}
