[package]
name = "bookclerk-workerd"
description = "Jailed workerd isolate launcher for Bookclerk script plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bookclerk-workerd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bookclerk-plugin-abi.workspace = true
bookclerk-plugin-host = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "process", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ureq.workspace = true

[lints]
workspace = true
