[package]
name = "bookclerk-plugin-sdk"
description = "Guest Bookclerk plugin SDK (Workers RPC ABI + BookclerkPlugin + stdio server)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Intended for crates.io later; keep unpublished until the public SDK surface stabilizes.
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bookclerk-plugin-abi.workspace = true
chrono = { workspace = true, features = ["serde"] }
sea-orm = { workspace = true, default-features = false, features = ["proxy"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
