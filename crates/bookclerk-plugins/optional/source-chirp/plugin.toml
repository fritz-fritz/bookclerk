api_version = 3
id = "chirp"
name = "Chirp"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=chirpbooks.com&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-chirp"
entrypoints = ["storefront"]

[capabilities.network]
mode = "outbound"
tcp = [
    { host = "api.chirpbooks.com", ports = [443] },
    { host = "www.chirpbooks.com", ports = [443] },
]
# GraphQL API + storefront. Cover/media download URLs come from the API
# (often CDN hosts); CONNECT to those hosts needs a matching `tcp` grant
# (operator additions or a wildcard). Fetch `domains` are workerd-only.

[vars]

[secrets]

[work_fs]
