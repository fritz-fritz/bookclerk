api_version = 3
id = "libro"
name = "Libro.fm"
version = "0.1.0"
logo = "https://www.google.com/s2/favicons?domain=libro.fm&sz=128"
runtime = "native"
command = "./bookclerk-plugin-source-libro"
entrypoints = ["storefront"]

[capabilities.network]
mode = "outbound"
tcp = [
    { host = "libro.fm", ports = [443] },
    { host = "www.libro.fm", ports = [443] },
    { host = "covers.libro.fm", ports = [443] },
]
# Native TCP via the SDK HTTP client. CDN hosts used only as redirect
# targets still need a TCP grant if they are the CONNECT destination.

[vars]

[secrets]

[work_fs]
