[package]
name = "bookclerk-plugin-source-audible"
description = "External Bookclerk Audible source plugin (JSON-RPC over stdio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-source", "audiobook"]

[package.metadata.bookclerk]
api_version = 1
kind = "source"
id = "audible"
display_name = "Audible"

[[bin]]
name = "bookclerk-plugin-source-audible"
path = "src/main.rs"

[dependencies]
bookclerk-audible.workspace = true
bookclerk-plugin-sdk.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
