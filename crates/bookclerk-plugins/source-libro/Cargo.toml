[package]
name = "bookclerk-plugin-source-libro"
description = "External Bookclerk Libro.fm source plugin (JSON-RPC over stdio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
keywords = ["bookclerk", "bookclerk-plugin", "bookclerk-source", "audiobook"]

[package.metadata.bookclerk]
api_version = 1
kind = "source"
id = "libro"
display_name = "Libro.fm"

[[bin]]
name = "bookclerk-plugin-source-libro"
path = "src/main.rs"

[dependencies]
bookclerk-libro.workspace = true
bookclerk-library.workspace = true
bookclerk-plugin-sdk.workspace = true
bookclerk-source.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
