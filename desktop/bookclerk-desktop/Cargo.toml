[package]
name = "bookclerk-desktop"
description = "Bookclerk desktop shell (Tauri) with system tray — Windows and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "bookclerk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bookclerk-desktop"
path = "src/main.rs"

# Tauri / tray only on shipping targets. Keeps Linux builds from compiling the
# GTK3 graph just to hit the ban (and documents intent in the manifest).
[target.'cfg(any(windows, target_os = "macos"))'.build-dependencies]
tauri-build.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
anyhow.workspace = true
bookclerk-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-shell.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true

[lints]
workspace = true
