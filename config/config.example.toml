# Example Libation configuration.
# Copy to `$LIBATION_FILES_DIR/config.toml` or pass `--config`.

[library]
auto_liberate = false
scan_interval_minutes = 60

[download]
quality = "high"   # high | normal
# Liberate currently stores Adrm output as m4b/m4a. `mp3` is accepted for
# classic Settings.json parity but does not re-encode yet.
format = "m4b"     # m4b | mp3 (mp3 not implemented)
# Widevine/CENC liberate is not implemented — leave false (Adrm aaxc only).
widevine = false
# Codec preference is not implemented yet.
xhe_aac = false

[storage]
backend = "local"  # local | s3

[storage.local]
# Absolute path recommended for Docker/systemd.
# Relative paths resolve under LIBATION_FILES_DIR (e.g. "Audiobooks").
root = "/data/Audiobooks"

[storage.s3]
bucket = "my-audiobooks"
prefix = "library/"
region = "us-east-1"
# endpoint = "https://minio.example.com"
# force_path_style = true

[daemon]
listen = "127.0.0.1:8787"
json_logs = true
